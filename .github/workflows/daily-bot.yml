name: Gmail AI Slack Bot

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create token.json
        run: |
          # This handles the base64 string you generated on your Mac
          echo "${{ secrets.GOOGLE_TOKEN_JSON }}" | base64 --decode > token.json

      - name: Debug File Mapping
        run: |
          echo "--- Debugging token.json ---"
          if [ -s "token.json" ]; then
            echo "Success: token.json exists and is not empty."
            echo "File size: $(stat -c%s token.json) bytes"
            echo "File starts with: $(head -c 1 token.json)"
          else
            echo "FAILURE: token.json is empty or missing!"
            exit 1
          fi

      - name: Run bot
        run: python src/bot.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
